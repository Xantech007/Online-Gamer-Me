<style>

.si { text-align: center; }

canvas#c { display: block; cursor: pointer; }

#winner-overlay { position:absolute;top:0;left:0;right:0;bottom:0;pointer-events:none;z-index:10;opacity:0;transition:opacity 0.4s; }

#winner-text-wrap { position:absolute;left:0;right:0;top:50%;transform:translateY(120%);transition:transform 0.65s cubic-bezier(0.22,1,0.36,1);text-align:center;z-index:12;padding:0 16px;pointer-events:none; }

#winner-line2 { font-family:'Courier New',monospace;font-size:38px;font-weight:900;color:#fff;text-shadow:0 0 20px #ffdd00,2px 2px 0 #666,4px 4px 0 #333;letter-spacing:2px;margin-top:4px; }
#winner-prize { font-family:'Courier New',monospace;font-size:32px;font-weight:900;color:#80ff80;text-shadow:0 0 30px #00ff00,0 0 60px #00aa00,2px 2px 0 #004400;letter-spacing:2px;margin-top:10px;min-height:40px; }
#winner-emoji { font-size:52px;margin-top:6px;display:block; }
#dismiss-btn { margin-top:16px;font-family:'Courier New',monospace;font-size:13px;letter-spacing:2px;padding:10px 28px;border-radius:8px;cursor:pointer;border:2px solid #e8d870;background:rgba(0,0,0,0.75);color:#e8d870;font-weight:700;pointer-events:all;position:relative;z-index:15; }
#dismiss-btn:hover { background:#e8d870;color:#000; }
/* GAME OVER */
#gameover-overlay { position:absolute;top:0;left:0;right:0;bottom:0;pointer-events:none;z-index:11;opacity:0;transition:opacity 0.5s; }
#gameover-overlay.active { opacity:1;pointer-events:none; }
#gameover-veil { position:absolute;top:0;left:0;right:0;bottom:0;background:rgba(10,0,0,0.70);pointer-events:none; }
#gameover-text-wrap { position:absolute;left:0;right:0;top:50%;transform:translateY(130%);transition:transform 0.7s cubic-bezier(0.22,1,0.36,1);text-align:center;z-index:12;padding:0 16px;pointer-events:none; }
#gameover-text-wrap.risen { transform:translateY(-50%); }
#go-line1 { font-family:'Press Start 2P',monospace;font-size:38px;color:#ff2020;text-shadow:4px 4px 0 #800000,8px 8px 0 #400000,0 0 40px #ff0000,0 0 80px #ff4400;letter-spacing:2px;line-height:1.3;animation:goFlicker 0.14s infinite alternate; }
@keyframes goFlicker { from{opacity:1}to{opacity:0.87} }
#go-line2 { font-family:'Press Start 2P',monospace;font-size:11px;color:#ff8080;text-shadow:2px 2px 0 #600000;letter-spacing:1px;margin-top:20px;line-height:1.8; }
#go-emoji { font-size:50px;margin-top:14px;display:block; }
#go-dismiss-btn { margin-top:20px;font-family:'Press Start 2P',monospace;font-size:11px;letter-spacing:1px;padding:12px 24px;border-radius:4px;cursor:pointer;border:2px solid #ff4040;background:rgba(0,0,0,0.85);color:#ff4040;font-weight:700;pointer-events:all;position:relative;z-index:15; }
#go-dismiss-btn:hover { background:#ff2020;color:#fff;border-color:#ff2020; }

<body>
<div id="scale-wrap">
<div id="wrap">
  <div id="hdr">
    <h1>&#9680; Redding Rotary &#9681;</h1>
    <h2>Launch Into Service</h2>
    <p>2026 / 2027</p>
  </div>
  <div id="prize-bar">
    <label>&#127942; PRIZE:</label>

      <div id="prize-prefix">$</div>

      <div id="winner-veil"></div>

  <div id="hint">&#8592; AIM THE LANDER &#8212; CLICK LAUNCH OR PRESS SPACE &#8594;</div>
  <div id="btns">
    <button id="lbtn">&#128640; LAUNCH</button>
    <button id="rbtn">&#8635; RESET</button>
  </div>
</div>
</div>
 
<script>
// ── SCALING ──────────────────────────────────────────────────
var GAME_W = 600;
function scaleGame() {
  var sw=document.getElementById('scale-wrap'), wrap=document.getElementById('wrap');
  var vw=window.innerWidth, vh=window.innerHeight, gameH=wrap.offsetHeight;
  var scale=Math.min(vw/GAME_W, vh/gameH);
  sw.style.transform='scale('+scale+')';
  sw.style.transformOrigin='top left';
  sw.style.left=Math.max(0,(vw-GAME_W*scale)/2)+'px';
  sw.style.top=Math.max(0,(vh-gameH*scale)/2)+'px';
}
window.addEventListener('resize', scaleGame);
 
// ── AUDIO ENGINE (Web Audio API — no files needed) ───────────
var AC = null;
function getAC() {
  if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
  if (AC.state === 'suspended') AC.resume();
  return AC;
}
 
function playTone(freq, type, vol, duration, fadeOut) {
  try {
    var ac = getAC();
    var osc = ac.createOscillator();
    var gain = ac.createGain();
    osc.connect(gain); gain.connect(ac.destination);
    osc.type = type || 'sine';
    osc.frequency.setValueAtTime(freq, ac.currentTime);
    gain.gain.setValueAtTime(vol || 0.3, ac.currentTime);
    if (fadeOut) gain.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + duration);
    osc.start(ac.currentTime);
    osc.stop(ac.currentTime + duration);
  } catch(e) {}
}
 
function playNoise(vol, duration, filterFreq) {
  try {
    var ac = getAC();
    var bufSize = ac.sampleRate * duration;
    var buf = ac.createBuffer(1, bufSize, ac.sampleRate);
    var data = buf.getChannelData(0);
    for (var i = 0; i < bufSize; i++) data[i] = Math.random() * 2 - 1;
    var src = ac.createBufferSource();
    src.buffer = buf;
    var filter = ac.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.value = filterFreq || 400;
    var gain = ac.createGain();
    gain.gain.setValueAtTime(vol, ac.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + duration);
    src.connect(filter); filter.connect(gain); gain.connect(ac.destination);
    src.start(); src.stop(ac.currentTime + duration);
  } catch(e) {}
}
 
// Thruster hum while descending
var thrusterNode = null, thrusterGain = null;
function startThruster() {
  try {
    var ac = getAC();
    thrusterNode = ac.createOscillator();
    thrusterGain = ac.createGain();
    var dist = ac.createWaveShaper();
    // mild distortion for rumble
    var curve = new Float32Array(256);
    for (var i = 0; i < 256; i++) { var x = (i * 2) / 256 - 1; curve[i] = (Math.PI + 400) * x / (Math.PI + 400 * Math.abs(x)); }
    dist.curve = curve;
    thrusterNode.type = 'sawtooth';
    thrusterNode.frequency.setValueAtTime(55, ac.currentTime);
    thrusterGain.gain.setValueAtTime(0.0, ac.currentTime);
    thrusterGain.gain.linearRampToValueAtTime(0.18, ac.currentTime + 0.3);
    thrusterNode.connect(dist); dist.connect(thrusterGain); thrusterGain.connect(ac.destination);
    thrusterNode.start();
  } catch(e) {}
}
function stopThruster() {
  try {
    if (thrusterGain) { thrusterGain.gain.linearRampToValueAtTime(0.001, AC.currentTime + 0.2); }
    setTimeout(function(){ try { thrusterNode.stop(); } catch(e){} thrusterNode=null; thrusterGain=null; }, 300);
  } catch(e) {}
}
 
function soundPegBounce(isRed) {
  if (isRed) {
    playTone(80 + Math.random()*40, 'square', 0.25, 0.12, true);
    playNoise(0.3, 0.08, 600);
  } else {
    playTone(200 + Math.random()*100, 'triangle', 0.15, 0.08, true);
  }
}
 
function soundExplosion() {
  try {
    var ac = getAC();
    // low boom
    playNoise(0.9, 1.2, 300);
    playNoise(0.6, 0.8, 150);
    // shock thump
    var osc = ac.createOscillator();
    var gain = ac.createGain();
    osc.connect(gain); gain.connect(ac.destination);
    osc.type = 'sine';
    osc.frequency.setValueAtTime(120, ac.currentTime);
    osc.frequency.exponentialRampToValueAtTime(20, ac.currentTime + 0.5);
    gain.gain.setValueAtTime(0.8, ac.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + 0.5);
    osc.start(); osc.stop(ac.currentTime + 0.5);
  } catch(e) {}
}
 
function soundCrowdCheer() {
  try {
    var ac = getAC();
    // Crowd noise burst
    playNoise(0.5, 3.0, 2000);
    // Fanfare — simple horn melody
    var notes = [523, 659, 784, 1047, 784, 1047, 1047];
    var times = [0, 0.18, 0.36, 0.55, 0.75, 0.88, 1.05];
    notes.forEach(function(freq, i) {
      setTimeout(function() {
        try {
          var o = ac.createOscillator();
          var g = ac.createGain();
          var dist2 = ac.createWaveShaper();
          var c2 = new Float32Array(256);
          for (var k=0;k<256;k++){var x=(k*2)/256-1;c2[k]=(Math.PI+200)*x/(Math.PI+200*Math.abs(x));}
          dist2.curve=c2;
          o.type='sawtooth'; o.frequency.value=freq;
          g.gain.setValueAtTime(0.35, ac.currentTime);
          g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime+0.22);
          o.connect(dist2); dist2.connect(g); g.connect(ac.destination);
          o.start(); o.stop(ac.currentTime+0.22);
        } catch(e){}
      }, times[i]*1000);
    });
  } catch(e) {}
}
 
// ── GAME ─────────────────────────────────────────────────────
var canvas=document.getElementById('c'), ctx=canvas.getContext('2d'), W=600, H=800;
canvas.width=W; canvas.height=H;
var NUM_ZONES=11,WIN_ZONE=5,ZW=W/NUM_ZONES,LAST_PEG_Y=80+16*38,GROUND_Y=LAST_PEG_Y+72;
var PAD_X=WIN_ZONE*ZW,PAD_W=ZW,PAD_Y=GROUND_Y,PAD_H=14;
var wins=0,launches=0,lander=null,pegs=[],particles=[],stars=[],landed=[],debris=[];
var falling=false,msgText='',msgColor='#fff',msgAlpha=0,prizeAmount=0;
var shuttle={x:W/2,dir:1,speed:1.2};var boostUsed=false,boosting=false,boostTimer=0,SHUTTLE_Y=24,shuttleActive=true;
var moonSurface=[],craters=[],explosionFlash=0,shockwaveRings=[];
var wCanvas=document.getElementById('winner-canvas'),wCtx=wCanvas.getContext('2d'),fwParticles=[],fwActive=false;
 
function resizeWC(){var cw=document.getElementById('canvas-wrap');wCanvas.width=cw.offsetWidth||W;wCanvas.height=cw.offsetHeight||H;}
 
function launchFW(){
  var x=40+Math.random()*(wCanvas.width-80),y=30+Math.random()*(wCanvas.height*0.6),hue=Math.floor(Math.random()*360),count=70+Math.floor(Math.random()*50);
  for(var i=0;i<count;i++){var angle=(Math.PI*2/count)*i+Math.random()*0.15,speed=2+Math.random()*5;fwParticles.push({x:x,y:y,vx:Math.cos(angle)*speed,vy:Math.sin(angle)*speed,life:1,decay:0.012+Math.random()*0.018,r:1.5+Math.random()*2.5,color:'hsl('+hue+','+(65+Math.random()*35)+'%,'+(55+Math.random()*35)+'%)',trail:[]});}
  for(var j=0;j<10;j++){var a2=(Math.PI*2/10)*j;fwParticles.push({x:x,y:y,vx:Math.cos(a2)*8,vy:Math.sin(a2)*8,life:1,decay:0.03,r:3,color:'#ffffff',trail:[]});}
}
 
function fwLoop(){
  if(!fwActive)return;requestAnimationFrame(fwLoop);wCtx.clearRect(0,0,wCanvas.width,wCanvas.height);
  if(Math.random()<0.055)launchFW();
  fwParticles.forEach(function(p){p.trail.push({x:p.x,y:p.y});if(p.trail.length>7)p.trail.shift();for(var t=0;t<p.trail.length;t++){wCtx.globalAlpha=(t/p.trail.length)*p.life*0.45;wCtx.fillStyle=p.color;wCtx.beginPath();wCtx.arc(p.trail[t].x,p.trail[t].y,p.r*0.5,0,Math.PI*2);wCtx.fill();}wCtx.globalAlpha=p.life;wCtx.fillStyle=p.color;wCtx.beginPath();wCtx.arc(p.x,p.y,p.r,0,Math.PI*2);wCtx.fill();p.x+=p.vx;p.y+=p.vy;p.vy+=0.07;p.vx*=0.97;p.life-=p.decay;});
  fwParticles=fwParticles.filter(function(p){return p.life>0;});wCtx.globalAlpha=1;
}
 
function showWinner(){
  resizeWC();
  // Prize shows on winner screen
  var prizeEl = document.getElementById('winner-prize');
  prizeEl.textContent = prizeAmount > 0 ? 'YOU WIN $' + prizeAmount.toFixed(2) + '!' : '';
  document.getElementById('winner-overlay').classList.add('active');
  setTimeout(function(){document.getElementById('winner-text-wrap').classList.add('risen');},60);
  fwActive=true;fwParticles=[];wCtx.clearRect(0,0,wCanvas.width,wCanvas.height);
  for(var i=0;i<5;i++)setTimeout(launchFW,i*150);
  fwLoop();
  soundCrowdCheer();
  shuttleActive=true;document.getElementById('lbtn').disabled=false;
  document.getElementById('hint').textContent='Next player — click Launch or press Space!';
}
 
function showGameOver(){document.getElementById('gameover-overlay').classList.add('active');setTimeout(function(){document.getElementById('gameover-text-wrap').classList.add('risen');},60);}
function hideGameOver(){document.getElementById('gameover-overlay').classList.remove('active');document.getElementById('gameover-text-wrap').classList.remove('risen');}
 
document.getElementById('dismiss-btn').addEventListener('click',function(){fwActive=false;fwParticles=[];wCtx.clearRect(0,0,wCanvas.width,wCanvas.height);document.getElementById('winner-overlay').classList.remove('active');document.getElementById('winner-text-wrap').classList.remove('risen');document.getElementById('hint').textContent='Aim the lander — click Launch or press Space!';});
document.getElementById('go-dismiss-btn').addEventListener('click',function(){hideGameOver();document.getElementById('hint').textContent='Aim the lander — click Launch or press Space!';});
 
function initMoon(){moonSurface=[];var bY=GROUND_Y+PAD_H+10;for(var x=0;x<=W;x+=4){var y=bY+Math.sin(x*0.018)*7+Math.sin(x*0.043)*4+Math.sin(x*0.09)*2+Math.sin(x*0.007)*10;moonSurface.push({x:x,y:y});}craters=[{x:40,y:GROUND_Y+PAD_H+30,rx:16,ry:5},{x:150,y:GROUND_Y+PAD_H+24,rx:11,ry:4},{x:420,y:GROUND_Y+PAD_H+28,rx:13,ry:5},{x:530,y:GROUND_Y+PAD_H+38,rx:17,ry:6},{x:360,y:GROUND_Y+PAD_H+50,rx:8,ry:3},{x:100,y:GROUND_Y+PAD_H+48,rx:7,ry:3},{x:480,y:GROUND_Y+PAD_H+55,rx:10,ry:4}];}
 
document.getElementById('prize-input').addEventListener('input',function(){
  var val=parseFloat(this.value),disp=document.getElementById('prize-display');
  if(!isNaN(val)&&val>0){prizeAmount=val;disp.style.display='block';disp.textContent='WIN $'+val.toFixed(2)+'!';}
  else{prizeAmount=0;disp.style.display='none';}
});
 
function initStars(){stars=[];for(var i=0;i<100;i++)stars.push({x:Math.random()*W,y:Math.random()*(GROUND_Y-40),r:Math.random()*1.2+0.3});}
function buildPegs(){pegs=[];var rows=17,cols=8,pX=48,sX=(W-pX*2)/(cols-1),sY2=80,sYs=38,rR=[8,9];for(var r=0;r<rows;r++){var iE=(r%2===0),rC=iE?cols:cols+1,rSX=iE?pX:pX-sX/2,iR=(rR.indexOf(r)!==-1);for(var c=0;c<rC;c++){var px=rSX+c*sX;if(px>8&&px<W-8)pegs.push({x:px,y:sY2+r*sYs,r:iR?8:6,flash:0,red:iR,pulse:Math.random()*Math.PI*2});}}}
 
function spawnP(x,y,color,n,sm){sm=sm||1;for(var i=0;i<n;i++){var a=Math.random()*Math.PI*2,s=(Math.random()*3.5+1)*sm;particles.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-2,life:1,decay:0.018+Math.random()*0.02,r:Math.random()*3+1,color:color});}}
 
function spawnBigExp(x,y){
  explosionFlash=2.0;
  shockwaveRings=[{x:x,y:y,r:5,maxR:220,life:1,color:'rgba(255,140,0,'},{x:x,y:y,r:5,maxR:160,life:1,color:'rgba(255,60,0,'},{x:x,y:y,r:5,maxR:100,life:1,color:'rgba(255,255,100,'}];
  var fc=['#ff2200','#ff5500','#ff8800','#ffcc00','#ffffff','#ff0000','#ffaa00'];
  for(var i=0;i<200;i++){var a=Math.random()*Math.PI*2,s=Math.random()*18+4;particles.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-5,life:1,decay:0.012+Math.random()*0.018,r:Math.random()*10+3,color:fc[Math.floor(Math.random()*fc.length)]});}
  for(var j=0;j<80;j++){var a2=Math.random()*Math.PI*2,s2=Math.random()*10+2;particles.push({x:x,y:y,vx:Math.cos(a2)*s2,vy:Math.sin(a2)*s2-3,life:0.9,decay:0.01+Math.random()*0.015,r:Math.random()*7+2,color:'#ff6600'});}
  for(var k=0;k<50;k++){var a3=Math.random()*Math.PI*2,s3=Math.random()*6+1;particles.push({x:x,y:y,vx:Math.cos(a3)*s3,vy:Math.sin(a3)*s3-2,life:0.85,decay:0.005+Math.random()*0.008,r:Math.random()*18+8,color:'rgba(60,60,60,0.55)'});}

function resolveLanding(x,y){
  
  lander.x=x;lander.y=GROUND_Y-lander.r;lander.vx=0;lander.vy=0;lander.done=true;falling=false;
  var zi=Math.min(NUM_ZONES-1,Math.max(0,Math.floor(lander.x/ZW)));
  var isWin=(zi===WIN_ZONE);
  if(isWin){wins++;spawnP(lander.x,lander.y,'#e8d870',30,1);landed.push({x:lander.x,y:lander.y,win:true});updateUI();setTimeout(showWinner,700);}
  else{spawnBigExp(lander.x,lander.y);soundExplosion();updateUI();setTimeout(function(){showGameOver();shuttleActive=true;document.getElementById('lbtn').disabled=false;document.getElementById('hint').textContent='GAME OVER — click Launch to try again!';},1200);}
}
 
function physics(){
  if(shuttleActive){shuttle.x+=shuttle.dir*shuttle.speed;if(shuttle.x>W-22){shuttle.x=W-22;shuttle.dir=-1;}if(shuttle.x<22){shuttle.x=22;shuttle.dir=1;}}
  if(!lander||lander.done)return;
  if(!boosting){lander.vx+=(Math.random()-0.5)*0.18;lander.vy+=0.063;if(lander.vy>2.45)lander.vy=3.5;}
  var steps=3,dvx=lander.vx/steps,dvy=lander.vy/steps;
  for(var s=0;s<steps;s++){
    lander.x+=dvx;lander.y+=dvy;
    if(!boosting && lander.y+lander.r>=GROUND_Y){resolveLanding(lander.x,lander.y);return;}
    if(lander.x<lander.r){lander.x=lander.r;lander.vx=Math.abs(lander.vx)*0.5;dvx=lander.vx/steps;}
    if(lander.x>W-lander.r){lander.x=W-lander.r;lander.vx=-Math.abs(lander.vx)*0.5;dvx=lander.vx/steps;}
    // During boost: skip peg collisions so lander flies through
    if(!boosting){
      for(var pi=0;pi<pegs.length;pi++){
        var p=pegs[pi],dx=lander.x-p.x,dy=lander.y-p.y,dist=Math.sqrt(dx*dx+dy*dy),minD=lander.r+p.r;
        if(dist<minD&&dist>0.1){
          var nx=dx/dist,ny=dy/dist;lander.x=p.x+nx*minD;lander.y=p.y+ny*minD;
          var dot=lander.vx*nx+lander.vy*ny;
          if(p.red){
            var bs=(Math.random()-0.5)*9;lander.vx=(lander.vx-2*dot*nx)*0.9+bs;lander.vy=(lander.vy-2*dot*ny)*0.85-Math.random()*1.5;
            p.flash=1.5;spawnP(p.x,p.y,'#ff2020',12,2);spawnP(p.x,p.y,'#ffaa00',6,1.5);
            soundPegBounce(true);
          } else {
            var sc=(Math.random()-0.5)*1.8;lander.vx=(lander.vx-2*dot*nx)*0.6+sc;lander.vy=(lander.vy-2*dot*ny)*0.58;
            if(Math.abs(dot)>0.3){p.flash=1;spawnP(p.x,p.y,'#80c0ff',3,1);soundPegBounce(false);}
          }
          dvx=lander.vx/steps;dvy=lander.vy/steps;
        }
      }
    }
  }
  lander.angle=lander.vx*0.09;
  if(boosting){
    boostTimer--;
    // Constant upward thrust overrides gravity during boost
    lander.vy = -1.0 - (boostTimer/180)*0.4; // gentle steady rise, slows near end
    lander.vx *= 0.96; // dampen sideways drift so it rises cleanly
    if(boostTimer<=0){boosting=false;lander.vy=-0.3;} // gentle fade out
  }
  if(boosting&&Math.random()<0.6){var bpc=['#ff4400','#ff8800','#ffcc00','#ffffff'];particles.push({x:lander.x+(Math.random()-0.5)*10,y:lander.y+10,vx:(Math.random()-0.5)*3,vy:2+Math.random()*4,life:0.8,decay:0.04+Math.random()*0.03,r:Math.random()*5+2,color:bpc[Math.floor(Math.random()*bpc.length)]});}
  lander.trail.push({x:lander.x,y:lander.y});if(lander.trail.length>14)lander.trail.shift();
  debris.forEach(function(d){d.x+=d.vx;d.y+=d.vy;d.vy+=0.15;d.vx*=0.98;d.angle+=d.spin;d.life-=d.decay;});
  debris=debris.filter(function(d){return d.life>0;});
}
 
function frame(){
  requestAnimationFrame(frame);physics();
  drawBg();drawRail();drawPegs();drawZones();drawMoon();drawPad();
  drawLanded();drawShuttle(shuttle.x,SHUTTLE_Y,shuttle.dir,shuttleActive);
  drawAL();drawDebris();drawSW();drawParticles();drawMsg();
  particles=particles.filter(function(p){p.x+=p.vx;p.y+=p.vy;p.vy+=0.1;p.life-=p.decay;p.r*=0.97;return p.life>0;});
  ctx.fillStyle='#4a5060';ctx.font='7px Courier New';ctx.textAlign='center';ctx.globalAlpha=0.6;
  ctx.fillText('REDDING ROTARY  \u2022  LAUNCH INTO SERVICE  \u2022  2026/2027',W/2,H-6);ctx.globalAlpha=1;
}
 
initStars();initMoon();buildPegs();updateUI();frame();
setTimeout(scaleGame,200);
